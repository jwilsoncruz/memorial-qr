<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1e1a3c">
<title>Memorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#1e1a3c;--noche-2:#2a2552;--vela:#f4b04a;--vela-2:#ffd58a;
  --piedra:#d9d4e4;--apagado:#b9b3cf;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);background:var(--noche);color:#fff;line-height:1.6;font-size:17px;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(70% 40% at 50% 0%,rgba(244,176,74,.18),transparent 70%);background-repeat:no-repeat}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--vela);outline-offset:3px;border-radius:4px}
main{max-width:720px;margin:0 auto;padding:36px 22px 60px}
h1,h2{font-family:var(--serif);line-height:1.12;font-weight:600}
h1{font-size:clamp(2rem,7vw,3.2rem);text-align:center;margin:0 0 4px}
h2{font-size:1.5rem;margin:40px 0 12px;color:var(--vela-2)}
p{margin:0 0 1em}
.oculto{display:none!important}

.retrato{width:150px;height:150px;border-radius:50%;margin:10px auto 20px;display:grid;place-items:center;overflow:hidden;font-family:var(--serif);font-size:3rem;background:linear-gradient(145deg,#6b5fb0,#3b3270);border:4px solid var(--vela);box-shadow:0 0 40px rgba(244,176,74,.3)}
.retrato img{width:100%;height:100%;object-fit:cover;display:block}
.fechas{text-align:center;color:var(--vela);font-family:var(--serif);font-size:1.25rem;margin-bottom:8px}
.frase{text-align:center;color:var(--piedra);font-style:italic;max-width:40ch;margin:0 auto 22px}

.btn{display:inline-block;border:0;border-radius:999px;padding:14px 26px;font:700 1rem var(--sans);cursor:pointer;text-decoration:none;color:inherit;transition:transform .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn-vela{background:var(--vela);color:#2b1c05}
.btn-vela:hover{background:var(--vela-2)}
.btn-vela:disabled{opacity:.6;cursor:default}
.btn-borde{background:transparent;border:2px solid var(--apagado);padding:10px 20px;font-size:.92rem}
.btn-borde:hover{border-color:#fff}
.acciones{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:6px}

/* altar de velas */
.velas{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.velas input{flex:1;min-width:150px}
.altar{position:relative;margin:14px 0;padding:12px 14px 18px;border-radius:14px;background:linear-gradient(#2a2552,#1e1a3c);border:1px solid #4a4478;overflow:hidden;min-height:140px;box-shadow:inset 0 -50px 70px rgba(244,176,74,.1)}
.altar::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 50% 70%,rgba(244,176,74,.6),transparent 70%);opacity:0;pointer-events:none}
.altar.brillo::before{animation:brillo 1.8s ease-out}
@keyframes brillo{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.vacio{position:absolute;inset:0;display:grid;place-items:center;color:var(--apagado);text-align:center;padding:0 20px}
.fila-velas{position:relative;display:flex;flex-wrap:wrap;gap:12px 13px;justify-content:center;align-items:flex-end}
.cv{position:relative;width:16px;height:46px;margin-top:34px;border-radius:3px 3px 2px 2px;background:linear-gradient(90deg,#e9dfc8,#fff6e0 50%,#d8caa8)}
.cv.c1{background:linear-gradient(90deg,#b9aee6,#e6dfff 50%,#9d90d6)}
.cv.c2{background:linear-gradient(90deg,#e8b36a,#ffd9a0 50%,#cf9650)}
.cv::before{content:"";position:absolute;left:50%;top:-6px;width:2px;height:7px;background:#3b2f23;transform:translateX(-50%)}
.cv i{position:absolute;left:50%;top:-31px;width:11px;height:24px;transform:translateX(-50%);transform-origin:50% 100%;background:radial-gradient(ellipse at 50% 70%,#fff6d6 0 25%,var(--vela-2) 45%,var(--vela) 70%,transparent 72%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;filter:drop-shadow(0 0 8px rgba(244,176,74,.85));animation:llamita 2s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes llamita{0%,100%{transform:translateX(-50%) scale(1,1) rotate(-2deg)}50%{transform:translateX(-50%) scale(.92,1.1) rotate(2deg)}}
.cv.nueva{animation:cae .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cae{from{transform:translateY(-90px);opacity:0}to{transform:none;opacity:1}}
.cv.nueva i{animation:enciende 1.1s .6s backwards,llamita 2s 1.7s ease-in-out infinite}
@keyframes enciende{0%{transform:translateX(-50%) scale(0)}30%{transform:translateX(-50%) scale(1.9,2.3);filter:drop-shadow(0 0 24px #fff)}100%{transform:translateX(-50%) scale(1)}}
#cuentaVelas{display:inline-block;color:var(--piedra)}
#cuentaVelas.bump{animation:bump .5s}
@keyframes bump{50%{transform:scale(1.25);color:var(--vela)}}
.gracias{min-height:1.6em;color:var(--vela-2);margin:10px 0 0}

input{font:inherit;padding:14px;border-radius:10px;border:2px solid #4a4478;background:var(--noche-2);color:#fff;width:100%}
input::placeholder{color:#8f89ac}
input:focus{border-color:var(--vela);outline:none}

/* árbol */
.arbol{width:100%;height:auto;display:block}
.arbol rect{fill:#2f2a62;stroke:#4a4478;stroke-width:2}
.arbol .yo{fill:#3b3270;stroke:var(--vela);stroke-width:3}
.arbol text{fill:#fff;font-family:Figtree,system-ui,sans-serif;text-anchor:middle}
.arbol .n{font-weight:700}
.arbol .s{fill:var(--apagado)}
.arbol path{fill:none;stroke:var(--apagado);stroke-width:2}

/* galería */
.galeria{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.galeria button{padding:0;border:0;background:#2f2a62;border-radius:10px;overflow:hidden;aspect-ratio:1;cursor:zoom-in}
.galeria img{width:100%;height:100%;object-fit:cover;display:block}
dialog{border:0;padding:0;background:transparent;max-width:96vw;max-height:96vh}
dialog::backdrop{background:rgba(10,8,25,.9)}
dialog img{display:block;max-width:96vw;max-height:90vh;border-radius:10px}

/* visitas */
.visita{display:grid;gap:8px;margin:12px 0}
#lista{list-style:none;padding:0;margin:0;display:grid;gap:8px}
#lista li{background:var(--noche-2);padding:12px 14px;border-radius:10px;border-left:3px solid var(--vela);overflow-wrap:anywhere}
#lista b{display:block;color:var(--vela-2);font-size:.92rem}

.pie{margin-top:56px;text-align:center;color:var(--apagado);font-size:.9rem}
.pie a{color:var(--vela-2)}
.nada{text-align:center;padding:80px 0}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>

<div id="nada" class="nada oculto">
  <h1>No encontramos este memorial</h1>
  <p>Revisa que el código QR o el enlace estén completos.</p>
</div>

<div id="memorial" class="oculto">
  <div class="retrato" id="retrato" aria-hidden="true"></div>
  <h1 id="nombre"></h1>
  <div class="fechas" id="fechas"></div>
  <p class="frase" id="frase"></p>

  <div class="acciones">
    <button class="btn btn-borde" type="button" id="btnCompartir">Compartir con la familia</button>
    <a class="btn btn-borde oculto" id="btnMapa" href="#" target="_blank" rel="noopener">Cómo llegar a la tumba</a>
  </div>

  <h2 id="tVela">Enciende una vela</h2>
  <div class="altar" id="altar">
    <div class="vacio" id="vacio">Sé la primera persona en encender una vela.</div>
    <div class="fila-velas" id="filaVelas" aria-hidden="true"></div>
  </div>
  <div class="velas">
    <input id="nomVela" maxlength="30" placeholder="Tu nombre (opcional)" aria-label="Tu nombre (opcional)">
    <button class="btn btn-vela" type="button" id="btnVela">Encender una vela</button>
  </div>
  <p class="gracias" id="graciasVela" aria-live="polite"></p>
  <p><span id="cuentaVelas"></span></p>

  <section id="secHistoria" class="oculto"><h2>Su historia</h2><div id="historia"></div></section>
  <section id="secFamilia" class="oculto"><h2>Su familia</h2><div id="familia"></div></section>
  <section id="secGaleria" class="oculto"><h2>Galería</h2><div class="galeria" id="galeria"></div></section>

  <h2>Libro de visitas</h2>
  <div class="visita">
    <input id="msgNombre" maxlength="30" placeholder="Tu nombre (opcional)" aria-label="Tu nombre (opcional)">
    <input id="msg" maxlength="200" placeholder="Escribe un recuerdo" aria-label="Escribe un recuerdo">
    <button class="btn btn-vela" type="button" id="btnMsg">Guardar recuerdo</button>
  </div>
  <p class="gracias" id="avisoMsg" aria-live="polite"></p>
  <ul id="lista"></ul>

  <p class="pie">Memorial creado con <a href="index.html">Memorial QR</a></p>
</div>

</main>

<dialog id="lb"><img id="lbImg" alt=""></dialog>

<script src="datos.js"></script>
<script>
const $ = id => document.getElementById(id);
const id = (new URLSearchParams(location.search).get("id") || "").trim().toLowerCase();
let M = (typeof MEMORIALES !== "undefined" && Object.prototype.hasOwnProperty.call(MEMORIALES, id)) ? MEMORIALES[id] : null;

function leer(k, def){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function guardar(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function cargaScript(src){
  return new Promise((ok, mal) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); });
}
function iniciales(n){ return n.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join(""); }

/* ---------- Árbol familiar (hasta 3 generaciones) ---------- */
function crearArbol(f, nombre, detalleYo){
  const padres = (f.padres || []).slice(0, 2), hijos = (f.hijos || []).slice(0, 6), pareja = f.pareja || null;
  if(!padres.length && !pareja && !hijos.length) return null;
  const NS = "http://www.w3.org/2000/svg", H = 54, W = 150;
  const el = (tag, attrs, texto) => {
    const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    if(texto !== undefined) e.textContent = texto;
    return e;
  };
  const caminos = [], nodos = [];
  const nodo = (cx, y, w, nom, det, esYo) => {
    const g = el("g", {});
    g.appendChild(el("rect", {x: cx - w/2, y: y, width: w, height: H, rx: 10, class: esYo ? "yo" : ""}));
    const fn = Math.max(11, Math.min(19, Math.floor(w * 0.9 / (nom.length * 0.56))));
    g.appendChild(el("text", {x: cx, y: y + 24, class: "n", "font-size": fn}, nom));
    if(det) g.appendChild(el("text", {x: cx, y: y + 44, class: "s", "font-size": Math.min(15, fn)}, det));
    nodos.push(g);
  };
  const yYo = padres.length ? 108 : 10;
  const yoCx = pareja ? 185 : 300;

  if(padres.length){
    const cxs = padres.length === 2 ? [205, 395] : [300];
    padres.forEach((p, i) => nodo(cxs[i], 10, W, p.nombre, p.detalle, false));
    if(padres.length === 2) caminos.push("M280 37H320");
    const sy = padres.length === 2 ? 37 : 64;
    caminos.push("M300 " + sy + "V" + (yYo - 28) + "H" + yoCx + "V" + yYo);
  }
  nodo(yoCx, yYo, W, nombre, detalleYo, true);
  if(pareja){
    nodo(415, yYo, W, pareja.nombre, pareja.detalle, false);
    caminos.push("M260 " + (yYo + 27) + "H340");
  }
  let fondo = yYo + H;
  if(hijos.length){
    const n = hijos.length, gap = 20;
    const kw = n <= 4 ? 130 : Math.floor((580 - gap * (n - 1)) / n);
    const total = n * kw + (n - 1) * gap, ini = 300 - total / 2 + kw / 2;
    const cxs = hijos.map((_, i) => ini + i * (kw + gap));
    const barY = yYo + 78, yK = yYo + 102;
    const sx = pareja ? 300 : yoCx, sy = pareja ? yYo + 27 : yYo + H;
    caminos.push("M" + sx + " " + sy + "V" + barY);
    if(n > 1) caminos.push("M" + cxs[0] + " " + barY + "H" + cxs[n - 1]);
    cxs.forEach(cx => caminos.push("M" + cx + " " + barY + "V" + yK));
    hijos.forEach((h, i) => nodo(cxs[i], yK, kw, h.nombre, h.detalle, false));
    fondo = yK + H;
  }
  const svg = el("svg", {viewBox: "0 0 600 " + (fondo + 6), class: "arbol", role: "img",
    "aria-label": "Árbol familiar de " + nombre});
  caminos.forEach(d => svg.appendChild(el("path", {d: d})));
  nodos.forEach(g => svg.appendChild(g));
  return svg;
}

/* ---------- Velas ---------- */
const MAX_VISIBLES = 24;
let velas = 0, velasIniciadas = false, ultimoToque = 0;
function crearVela(i, nueva){
  const v = document.createElement("div");
  v.className = "cv c" + (i % 3) + (nueva ? " nueva" : "");
  const f = document.createElement("i");
  f.style.setProperty("--d", ((i * 0.37) % 2).toFixed(2) + "s");
  v.appendChild(f);
  return v;
}
function pintaCuenta(rebote){
  const c = $("cuentaVelas");
  c.textContent = velas === 0 ? "" : velas + (velas === 1 ? " vela encendida" : " velas encendidas");
  $("vacio").classList.toggle("oculto", velas > 0);
  if(rebote){ c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
}
function ponerVelas(n){
  const fila = $("filaVelas");
  if(!velasIniciadas){
    velasIniciadas = true; velas = n;
    for(let i = 0; i < Math.min(n, MAX_VISIBLES); i++) fila.appendChild(crearVela(i, false));
    pintaCuenta(false);
    return;
  }
  if(n > velas){
    const nuevas = Math.min(n - velas, 3);
    for(let k = 0; k < nuevas; k++) fila.prepend(crearVela(velas + k + 1, true));
    while(fila.children.length > MAX_VISIBLES) fila.lastChild.remove();
    $("altar").classList.remove("brillo"); void $("altar").offsetWidth; $("altar").classList.add("brillo");
    velas = n; pintaCuenta(true);
  } else { velas = n; pintaCuenta(false); }
}

/* ---------- Libro de visitas ---------- */
function pintaMensajes(lista){
  const ul = $("lista"); ul.innerHTML = "";
  lista.forEach(m => {
    const li = document.createElement("li");
    if(m.nombre){ const b = document.createElement("b"); b.textContent = m.nombre; li.appendChild(b); }
    li.appendChild(document.createTextNode(m.texto));
    ul.appendChild(li);
  });
}

/* ---------- Arranque ---------- */
async function iniciar(){
  /* Si no está en datos.js, se busca su propio archivo: datos/ID.json */
  if(!M && /^[a-z0-9-]+$/.test(id)){
    try{
      const r = await fetch("datos/" + id + ".json", {cache: "no-cache"});
      if(r.ok) M = await r.json();
    }catch(e){ M = null; }
  }
  if(!M){ $("nada").classList.remove("oculto"); return; }
  $("memorial").classList.remove("oculto");
  document.title = M.nombre + " · Memorial";

  /* Encabezado */
  const ret = $("retrato");
  const pon_iniciales = () => { ret.textContent = iniciales(M.nombre); };
  if(M.foto){
    const img = document.createElement("img");
    img.alt = ""; img.src = M.foto; img.onerror = () => { img.remove(); pon_iniciales(); };
    ret.appendChild(img);
  } else pon_iniciales();
  $("nombre").textContent = M.nombre;
  $("fechas").textContent = M.nacimiento + " – " + M.fallecimiento;
  $("frase").textContent = M.frase || "";
  if(!M.frase) $("frase").classList.add("oculto");
  const primer = M.nombre.split(/\s+/)[0];
  $("tVela").textContent = "Enciende una vela por " + primer;

  if(M.ubicacion){
    $("btnMapa").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(M.ubicacion);
    $("btnMapa").classList.remove("oculto");
  }
  $("btnCompartir").onclick = () => {
    const d = {title: "Memorial de " + M.nombre, text: "Te comparto el memorial de " + M.nombre + ".", url: location.href};
    if(navigator.share){ navigator.share(d).catch(() => {}); }
    else window.open("https://wa.me/?text=" + encodeURIComponent(d.text + " " + d.url), "_blank", "noopener");
  };

  /* Historia */
  if(M.historia && M.historia.length){
    $("secHistoria").classList.remove("oculto");
    M.historia.forEach(t => { const p = document.createElement("p"); p.textContent = t; $("historia").appendChild(p); });
  }
  /* Familia */
  if(M.familia){
    const anio = s => (String(s).match(/\d{4}/g) || []).pop() || s;
    const svg = crearArbol(M.familia, M.nombre, anio(M.nacimiento) + " – " + anio(M.fallecimiento));
    if(svg){ $("secFamilia").classList.remove("oculto"); $("familia").appendChild(svg); }
  }
  /* Galería */
  if(M.galeria && M.galeria.length){
    $("secGaleria").classList.remove("oculto");
    M.galeria.forEach(src => {
      const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", "Ampliar foto");
      const im = document.createElement("img"); im.src = src; im.loading = "lazy"; im.alt = "Foto de " + M.nombre;
      b.appendChild(im);
      b.onclick = () => { $("lbImg").src = src; $("lb").showModal(); };
      $("galeria").appendChild(b);
    });
    $("lb").addEventListener("click", () => $("lb").close());
  }

  /* Velas y mensajes: Firebase si está configurado, si no, solo en este celular */
  let db = null;
  if(typeof FIREBASE_CONFIG !== "undefined" && FIREBASE_CONFIG){
    try{
      const v = "10.12.2";
      await cargaScript("https://www.gstatic.com/firebasejs/" + v + "/firebase-app-compat.js");
      await cargaScript("https://www.gstatic.com/firebasejs/" + v + "/firebase-firestore-compat.js");
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
    }catch(e){ db = null; }
  }
  const kV = "mqr_" + id + "_velas", kM = "mqr_" + id + "_mensajes";

  if(db){
    const ref = db.collection("memoriales").doc(id);
    ref.onSnapshot(s => ponerVelas(s.exists ? (s.data().velas || 0) : 0), () => ponerVelas(0));
    ref.collection("mensajes").orderBy("fecha", "desc").limit(30).onSnapshot(
      snap => pintaMensajes(snap.docs.map(d => d.data())), () => {});
  } else {
    ponerVelas(leer(kV, 0));
    pintaMensajes(leer(kM, []));
  }

  $("btnVela").onclick = async () => {
    const ahora = Date.now();
    if(ahora - ultimoToque < 1500) return;
    ultimoToque = ahora;
    const n = $("nomVela").value.trim();
    try{
      if(db) await db.collection("memoriales").doc(id).set({velas: firebase.firestore.FieldValue.increment(1)}, {merge: true});
      else { guardar(kV, velas + 1); ponerVelas(velas + 1); }
      $("graciasVela").textContent = (n ? "Gracias, " + n + ". " : "") + "Tu vela ya está encendida por " + primer + ".";
      try{ if(navigator.vibrate) navigator.vibrate(40); }catch(e){}
    }catch(e){
      $("graciasVela").textContent = "No se pudo encender la vela. Revisa tu conexión e intenta de nuevo.";
    }
  };

  async function agregar(){
    const t = $("msg").value.trim(), n = $("msgNombre").value.trim();
    if(!t) return;
    try{
      if(db) await db.collection("memoriales").doc(id).collection("mensajes").add({texto: t, nombre: n, fecha: firebase.firestore.FieldValue.serverTimestamp()});
      else { const l = leer(kM, []); l.unshift({texto: t, nombre: n}); guardar(kM, l); pintaMensajes(l); }
      $("msg").value = ""; $("avisoMsg").textContent = "Gracias por dejar tu recuerdo.";
    }catch(e){
      $("avisoMsg").textContent = "No se pudo guardar el recuerdo. Intenta de nuevo.";
    }
  }
  $("btnMsg").onclick = agregar;
  $("msg").addEventListener("keydown", e => { if(e.key === "Enter") agregar(); });
}
iniciar();
</script>
</body>
</html>
